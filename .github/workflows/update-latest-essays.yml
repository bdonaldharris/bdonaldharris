name: Update latest essays

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-latest-essays.yml"

permissions:
  contents: write

concurrency:
  group: update-latest-essays
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update latest essays in README
        run: node .github/scripts/update-latest-essays.mjs

      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update latest essays"
          git push
